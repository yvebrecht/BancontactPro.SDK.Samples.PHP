# The sample web UI in Docker, from the prebuilt image (built by .github/workflows/sample-web-image.yml and published to
# GitHub Container Registry). Works as a stack in Portainer and any other tool that cannot run a build. From this folder:
#   cp .env.example .env    # fill in the credentials
#   docker compose up -d
# then open http://localhost:5087. To build the image yourself instead (needs BancontactPro.PHP cloned next to this repository):
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up --build
#
# The port is published on 127.0.0.1 only: the app has no login and calls Bancontact with your credentials. On a server, put
# a reverse proxy with its own login in front of it, or set SAMPLE_WEB_BIND to another address on purpose.
services:
  sample-web:
    image: ${SAMPLE_WEB_IMAGE:-ghcr.io/yvebrecht/bancontactpro-sample-web-php:latest}
    restart: unless-stopped
    ports:
      - "${SAMPLE_WEB_BIND:-127.0.0.1}:${SAMPLE_WEB_PORT:-5087}:8080"
    environment:
      # The address Bancontact reaches the callback at (a tunnel to the published port), no trailing slash.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:5087}
      BANCONTACT_ENVIRONMENT: ${BANCONTACT_ENVIRONMENT:-Preprod}
      BANCONTACT_ONDISPLAY_API_KEY: ${BANCONTACT_ONDISPLAY_API_KEY:-}
      BANCONTACT_ONDISPLAY_PPID: ${BANCONTACT_ONDISPLAY_PPID:-}
      BANCONTACT_ONRECEIPT_API_KEY: ${BANCONTACT_ONRECEIPT_API_KEY:-}
      BANCONTACT_ONRECEIPT_PPID: ${BANCONTACT_ONRECEIPT_PPID:-}
      BANCONTACT_STATICQR_API_KEY: ${BANCONTACT_STATICQR_API_KEY:-}
      BANCONTACT_STATICQR_PPID: ${BANCONTACT_STATICQR_PPID:-}
      BANCONTACT_TOPUP_API_KEY: ${BANCONTACT_TOPUP_API_KEY:-}
      BANCONTACT_TOPUP_PPID: ${BANCONTACT_TOPUP_PPID:-}
